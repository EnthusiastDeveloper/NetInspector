syntax = "proto3";

option java_package = "dev.enthusiastdev.netinspector.data.persistence.proto";
option java_multiple_files = true;

// design §10 - "DataStore (Proto) holds preferences: scan cadence, sweep concurrency and
// timeouts, port presets, theme, units, and the one-time scanning acknowledgement flag."
// Phase 5 needs only the acknowledgement flag; the rest are added by whichever later phase
// builds the settings screen, as new fields on this same message (proto3 fields are
// additive, so this never needs a migration for that).
message AppPreferences {
  // design §11.4 - "not skippable, not repeated": gates the first LAN sweep.
  bool lan_scan_acknowledged = 1;

  // Phase 8 / design §10 resolved decision #4 - retention in days for `scan_session` (cascades
  // to `scan_observation`) and `diagnostic_run` respectively, read by the periodic cleanup
  // WorkManager job in `:app`. Proto3 scalars default to 0, which isn't a valid retention
  // value, so 0 here is read by the repository as "unset" and substituted with the design
  // doc's defaults (30 / 90) rather than actually meaning "delete everything immediately."
  int32 scan_history_retention_days = 2;
  int32 diagnostic_history_retention_days = 3;

  // Phase 8 / design §10 - the rest of the settings screen's fields. Stored as the enum/preset
  // name rather than a proto enum: keeps the same "empty/0 means unset, substitute the
  // default" pattern the retention fields above already use, with one shared parsing shape
  // (`runCatching { T.valueOf(raw) }.getOrDefault(default)`) instead of a second one for
  // proto's generated enum type.
  string theme_mode = 4;
  string rssi_display_unit = 5;
  string default_port_preset = 6;
  int32 default_port_custom_start = 7;
  int32 default_port_custom_end = 8;

  // User-dismissed the Connection dashboard's continuous-monitoring card. Persists across
  // restarts; the Settings screen offers the only way back once dismissed.
  bool monitoring_card_dismissed = 9;

  // improvement-ideas.md #5 - lets the continuous-monitoring notification (MonitoringService)
  // actually alert on a weak signal / drop / reconnect instead of only displaying live state.
  // 0 is never a realistic Wi-Fi RSSI reading, so it doubles as "unset" the same way the
  // retention fields above use 0, substituted with a sane weak-signal default by the repository.
  int32 rssi_alert_threshold_dbm = 10;
  bool alert_on_rssi_drop = 11;
  bool alert_on_disconnect = 12;
  bool alert_on_reconnect = 13;
}
