name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No instrumented tests here - the emulator has no Wi-Fi radio, so scanning, sweeping
      # and diagnostics can't run in CI regardless (design doc C-13). Only JVM unit tests,
      # static analysis and a debug assemble run here; the device matrix is manual.
      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: detekt
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Module-boundary violations (design §2.1) fail at project-configuration time, so this
      # step alone would already catch one - it doesn't need a dedicated task.
      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

  # improvement-ideas.md #32 - a separate job, not a step in `build` above: it must never
  # affect that job's pass/fail outcome (docs/adr/0009-hand-rolled-benchmark-harness.md), and
  # `continue-on-error: true` here keeps a benchmark-runner hiccup from blocking the merge
  # while still surfacing as a distinct, reviewable status.
  benchmark:
    name: LAN sweep benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run benchmarks
        run: ./scripts/run-benchmarks.sh

      - name: Compare against baseline
        run: ./scripts/compare-benchmarks.sh
