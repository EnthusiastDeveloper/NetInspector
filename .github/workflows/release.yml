name: Release

# Tag pushes (v*.*.*) run the full pipeline and publish a GitHub Release.
# workflow_dispatch runs the same build+verify+smoke-test gates without publishing,
# so the pipeline itself can be exercised on a branch before it's trusted for a real tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history for the version-bump check below

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: yes | sdkmanager "build-tools;35.0.0" > /dev/null

      - name: Verify tag matches project version
        id: version
        run: |
          APP_VERSION_NAME=$(grep -Po '(?<=^appVersionName = ")[^"]+' gradle/libs.versions.toml)
          APP_VERSION_CODE=$(grep -Po '(?<=^appVersionCode = ")[^"]+' gradle/libs.versions.toml)
          echo "version_name=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag push (manual dispatch) - skipping tag/version-bump checks."
            exit 0
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$APP_VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersionName ($APP_VERSION_NAME) in gradle/libs.versions.toml"
            exit 1
          fi

          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION_CODE=$(git show "${PREV_TAG}:gradle/libs.versions.toml" | grep -Po '(?<=^appVersionCode = ")[^"]+')
            if [ "$APP_VERSION_CODE" -le "$PREV_VERSION_CODE" ]; then
              echo "::error::appVersionCode ($APP_VERSION_CODE) must be greater than the previous release's ($PREV_VERSION_CODE, from tag $PREV_TAG). Obtainium and Android's package installer both key updates off this value."
              exit 1
            fi
          fi

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: detekt
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify APK signing certificate
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}" | tee apksigner-output.txt

          ACTUAL_SHA256=$(grep -Po '(?<=SHA-256 digest: )[0-9a-f]+' apksigner-output.txt | head -n1)
          EXPECTED_SHA256=$(echo "${{ secrets.RELEASE_CERT_SHA256 }}" | tr -d ':' | tr 'A-F' 'a-f')

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signing certificate fingerprint doesn't match RELEASE_CERT_SHA256. Refusing to publish - this would break in-place updates for existing users."
            exit 1
          fi

          BADGING=$("$BUILD_TOOLS/aapt" dump badging "${{ steps.apk.outputs.path }}")
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.version_name }}'" || {
            echo "::error::Built APK versionName doesn't match gradle/libs.versions.toml (${{ steps.version.outputs.version_name }})"
            exit 1
          }

      - name: Compute checksum
        run: sha256sum "${{ steps.apk.outputs.path }}" > "${{ steps.apk.outputs.path }}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          retention-days: 14

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Locate APK
        id: apk
        run: echo "path=$(find apk -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Install, launch and check for a crash-free start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install "${{ steps.apk.outputs.path }}"
            adb logcat -c
            adb shell monkey -p dev.enthusiastdev.netinspector -c android.intent.category.LAUNCHER 1
            sleep 10
            if adb shell pidof dev.enthusiastdev.netinspector > /dev/null; then
              echo "App is running after launch."
            else
              echo "::error::App process died shortly after launch."
              adb logcat -d | grep -A 30 "FATAL EXCEPTION" || adb logcat -d | tail -n 100
              exit 1
            fi
            if adb logcat -d | grep -q "FATAL EXCEPTION.*dev.enthusiastdev.netinspector"; then
              echo "::error::Fatal exception found in logcat after launch."
              adb logcat -d | grep -A 30 "FATAL EXCEPTION"
              exit 1
            fi

  publish:
    needs: [build, smoke-test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NetInspector ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apk/*.apk
            apk/*.sha256
