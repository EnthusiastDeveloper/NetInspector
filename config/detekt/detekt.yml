build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable'] # state + several callbacks is the normal Compose screen shape
  TooManyFunctions:
    thresholdInClasses: 20 # SettingsViewModel is a flat aggregation of one setter per independent
      # setting - it only grows as more settings are added, not a sign it needs splitting up
    thresholdInInterfaces: 20 # AppSettingsRepository is the same flat one-getter-plus-setter-per-
      # setting shape as SettingsViewModel above, for the same reason
    thresholdInFiles: 20 # DeviceHintHeuristics.kt is one cohesive set of small, independent
      # `xDeviceHint`-shaped pure functions that all feed deviceHintFor's candidate list - it
      # only grows as new signals are added, not a sign any one function needs splitting out

style:
  MagicNumber:
    active: false # network/RF code is full of legitimate constants (channel widths, ports, MHz bounds)
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 4 # early-return state derivation (e.g. posture/security-type mapping) reads better flat

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # PascalCase is the Compose convention for UI-emitting functions
